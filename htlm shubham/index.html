<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="./Dashboard.html">
        <!-- HTML form में action बताता है कि form submit होने पर data कहाँ भेजना है। -->
        <input type="email" placeholder="Company Email" name="companyEmail">
        <input type="email" placeholder="Personal Email" name="personalEmail">
        <input type="password" placeholder="password" name="password">
        <button>Login</button>
    </form>
    <audio controls>
        <source src="./class.mp4" type="">
    </audio>
    <br>
    <video controls autoplay muted width="400px" >
        <source src="./class.mp4" type="video/mp4" >
    </video>
    <video controls  width="400px" height="225px" >
        <source src="https://www.youtube.com/watch?v=BvKxCCVNXrY"  >
    </video>
    
</body>
</html>
