<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-size: 50px;
            font-weight: 700;
            margin: 0;
            padding: 0;
        }
        #flex {
            height: 100vh;
            display: flex;
            /* flex-direction: column-reverse; */
            justify-content: space-around;
            align-items: center;
        }

        #container {
            width: 300px;
            height: 300px;
            background-color: blue;
            /* display: inline-block; */
        }

        #box {
            width: 300px;
            height: 300px;
            background-color: red;
            /* display: inline-block; */
        }
       
        #box-1 {
            width: 300px;
            height: 300px;
            background-color: rgb(170, 117, 117);
            /* display: inline-block; */
        }
    </style>
</head>

<body>
    <!-- Flex-box  -->
    <div id="flex">
        <div id="container">Box-1</div>
        <div id="box">Box-2</div>
        <div id="box-1">Box-3</div>
    </div>
</body>

</html>
