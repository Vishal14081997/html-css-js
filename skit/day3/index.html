<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- flex -->
    <div style="display: flex; gap: 10px;">
        <div style="border: 1px solid black; padding: 10px 20px 40px 0; background-color: aqua;">box-1</div>
        <div style="border: 1px solid black; padding: 10px 20px 40px 0; background-color: red; color: white;">box-2
        </div>
        <div style="border: 1px solid black; padding: 10px 20px 40px 0;">box-3</div>
    </div>

    <br>
    <div class="container">
        <div class="box">box</div>
        <div class="box">box</div>
        <div class="box">box</div>
        <div class="box">box</div>
        <div class="box">box</div>
        <div class="box">box</div>
        <div class="box">box</div>
        <div class="box">box</div>
    </div>

    <!-- .................................... -->

    <br>
    <div
        style="display: flex; background-color: aqua ; gap: 10px; justify-content: space-around; align-items:center ; height: 60px; ">
        <div class="item">box</div>
        <div class="item">box</div>
        <div class="item">box</div>
        <div class="item">box</div>
    </div>
    <br>

    <!-- grid  -->

    <div class="grid-container">
        <div class="grid-item">Box-1</div>
        <div class="grid-item">Box-2</div>
        <div class="grid-item">Box-3</div>
        <div class="grid-item">Box-4</div>
        <div class="grid-item">Box-4</div>
        <div class="grid-item">Box-4</div>
    
    </div>


    <!-- Pseudo -->

     <!-- 1)Pseudo class  -> : (single colon)
     2)Pseudo element -> :: (Double colon) -->
<br>
     <button class="btn">Click me</button>
     <br>
     <input type="text" placeholder="enter your name">


</body>
</html>
