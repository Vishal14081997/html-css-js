<!DOCTYPE html>

    <link rel="stylesheet" href="./style.css">

        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header class="header">
        <div class="flipkart">

            <div class="delivery" style="background-color: rgb(255, 229, 31);">
                <div><img src="https://rukminim1.flixcart.com/fk-p-flap/52/44/image/d2ecfddf891a3922.png?q=60" alt="">
                </div>
                <div>Flipkart</div>
            </div>
            <div class="delivery">
                <div><img src="https://rukminim1.flixcart.com/fk-p-flap/56/44/image/716adbc920ad1eba.png?q=60" alt="">

            </div>
            <div class="delivery">
                <div><img src="https://rukminim1.flixcart.com/fk-p-flap/58/44/image/7ab4040af860941d.png?q=60" alt="">
                </div>
                <div>Travel</div>
            </div>
            <div class="delivery">

                <div>Grocery</div>
            </div>
        </div>

        <div class="location">
            <div><i class="fa-solid fa-location-dot"></i></div>
            <div>4007889</div>

        </div>

    <nav class="navbar">

        </div>

        <div class="menu">
            <div class="item">
                <div><i class="fa-solid fa-circle-user"></i></div>
                <div>Login</div>

            </div>
            <div class="item">
                <div>More</div>
                <i class="fa-solid fa-angle-down"></i>
            </div>
            <div class="item">
                <div><i class="fa-solid fa-cart-arrow-down"></i></div>
                <div>Cart</div>
                <i class="fa-solid fa-angle-down"></i>
            </div>

        </div>
